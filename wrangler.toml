name = "gtfs-collector"
main = "src/worker.js"
compatibility_date = "2024-09-01"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "gtfs-lviv"

[triggers]
crons = ["* 1-21 * * *"]  # fires every minute UTC 01–21; worker polls every 10s (six 10s steps per fire); runtime guard (Kyiv <4 skip) gates the 04:00 start across DST
